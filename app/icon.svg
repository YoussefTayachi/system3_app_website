<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Frostbreaker">
  <title>Frostbreaker</title>
  <!--
    FROSTBREAKER, Bildmarke.

    Ein f im abgerundeten Quadrat. Das ist das Zeichen, das vorher schon da
    war; der Betreiber hat es der abstrakten Fassung vorgezogen. Neu ist nur
    die Ausfuehrung: das alte setzte den Buchstaben als Arial-TEXT, war also
    von einer Systemschrift abhaengig und sah auf jedem Geraet ein wenig
    anders aus. Hier ist er als Pfad gezeichnet und ueberall gleich.

    WAS SICH GEGENUEBER DEM ALTEN ZEICHEN AENDERT
    - Buchstabe als Pfad statt als Arial-Text.
    - Markenblau #0284C7 statt sky-500 #0EA5E9. Das alte Blau stammt von vor
      dem Redesign vom 15.08. und passte nicht mehr zur Wortmarke.
    - Groesserer Eckenradius. Beim alten Zeichen schnitt die Kreisbeschneidung
      von YouTube, LinkedIn und X die Ecken so an, dass ein Achteck uebrig
      blieb; nachgesehen bei 88px. Mit rx 118 liegt die Rundung ausserhalb des
      einbeschriebenen Kreises und faellt sauber weg.
    - Sichtbarer Querbalken, mittige Stellung. Der alte Buchstabe sass unten
      rechts und hatte kaum Querbalken.

    DER EINWAND, DER BLEIBT
    Blaues Quadrat mit weissem Kleinbuchstaben f ist nahe an Facebooks
    Symbol. Der Betreiber kennt den Einwand und hat sich bewusst dafuer
    entschieden. Querbalken und mittige Stellung sind der Abstand, den die
    Form hergibt.

    Die abstrakte Alternative liegt als frostbreaker-marke-scheibe.svg
    daneben: eine gebrochene Eisscheibe, ohne Verwechslungsgefahr.

    Verworfen wurde eine dritte Fassung, die den Buchstaben selbst brechen
    liess (Querbalken versetzt). Bei 48px war er nicht mehr als f zu lesen,
    sondern als Blitz.

    ACHTUNG BEIM BEARBEITEN: in diesem Kommentar darf keine doppelte
    Bindestrichfolge stehen. XML verbietet sie innerhalb eines Kommentars,
    und ein als img eingebundenes SVG wird streng geparst.
  -->
  <rect width="512" height="512" rx="118" fill="#0284C7"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="62" stroke-linecap="butt">
    <path d="M 262 400 V 228 A 74 74 0 0 1 336 154"/>
    <path d="M 182 252 H 342"/>
  </g>
</svg>
